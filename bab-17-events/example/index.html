<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop JavaScript - Pendaftaran</title>

    <!-- ============================================================ -->
    <!-- BAGIAN CSS: Gaya tampilan (seperti dekorasi meja pendaftaran) -->
    <!-- ============================================================ -->
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<div class="container">

    <!-- ============================================================ -->
    <!-- CARD 1: FORM PENDAFTARAN                                     -->
    <!-- ============================================================ -->
    <div class="card">
        <div class="card-header">
            <span>📝 Form Pendaftaran</span>
            <span class="total-badge" id="total-badge">Total: 0</span>
        </div>

        <form id="form-pendaftaran">

            <!-- Nama -->
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" placeholder="Nama lengkap" autofocus />
                <div class="char-count" id="char-count">Jumlah karakter: 0</div>
                <div class="key-message" id="key-message"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Email" />
            </div>

            <!-- Tombol -->
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Daftar Sekarang</button>
                <button type="button" id="reset-btn" class="btn btn-secondary">Reset Form</button>
            </div>

            <!-- Notifikasi (sukses/error) akan muncul di sini -->
            <div id="form-notification" class="form-notification"></div>
        </form>
    </div>

    <!-- ============================================================ -->
    <!-- CARD 2: DAFTAR PESERTA                                      -->
    <!-- ============================================================ -->
    <div class="card">
        <div class="card-header">
            <span>👥 Daftar Peserta</span>
            <button type="button" id="clear-all-btn" class="btn btn-danger" style="padding: 6px 16px; font-size: 0.8rem;">Hapus Semua</button>
        </div>

        <div id="participant-list-container">
            <!-- akan diisi oleh JavaScript -->
            <p class="empty-message">Belum ada peserta.</p>
        </div>
    </div>

</div>

<!-- ============================================================ -->
<!-- BAGIAN JAVASCRIPT: Otak / logika interaksi                   -->
<!-- ============================================================ -->
<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Tiket Bioskop</title>
    <link rel="stylesheet" href="tugas-35.css">
</head>
<body>
    <div class="container">

        <div class="card">
            <div class="header">
                <span>Form Pemesanan Tiket</span>
                <span class="total-badge" id="total-badge">Total: 0 Tiket</span>
            </div>

            <form id="form pemesanan">
                <div class="from-group">
                    <label for="nama">Nama Pesanan:</label>
                    <input type="text" id="nama" placeholder="Masukan Nama Lengkap" autofocus />
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" placeholder="contoh@gmail.com" />
                </div>

                <div class="from-group">
                    <label for="film">Judul Film:</label>
                    <input type="text" id="film" placeholder="Masukkan nama film" />
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Pesan Tiket</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Reset From</button>
                </div>

                <div id="form-notification" class="from-notification"></div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <span>Daftar Tiket Pemesanan</span>
                <button type="button" id="clear-all-btn" class="btn btn-danger">Hapus Semua</button>
            </div>

            <div id="ticket-list-container">
                <p class="empty-message">Belum ada tiket yang di pesan.</p>
            </div>
        </div>
    </div>
    <script src="./tugas-35.js"></script>
</body>
</html>
